<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tolart — Street Art</title>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.15.0/simple-lightbox.min.css">

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:#000;
  color:#eee;
}

/* MENU */
nav{
  position:fixed;
  top:0; right:0;
  padding:1rem 1.5rem;
  z-index:100;
}
nav a{
  color:#aaa;
  text-decoration:none;
  margin-left:1.2rem;
  font-size:.9rem;
}
nav a:hover{color:#f72585}

/* HERO */
header{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  background:#000;
}
header::after{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.ibb.co/djRtX3m/spray-texture.png") repeat;
  opacity:.15;
}
header h1{
  font-family:'Permanent Marker',cursive;
  font-size:5rem;
  letter-spacing:4px;
  z-index:1;
}
header p{
  z-index:1;
  opacity:.8;
}

/* SECTIONS */
section{
  padding:8rem 4vw;
  max-width:1600px;
  margin:auto;
}
h2{
  font-family:'Permanent Marker',cursive;
  font-size:2.5rem;
  margin-bottom:3rem;
}

/* MUR STREET */
.portfolio{
  columns:4 280px;
  column-gap:2rem;
}
.portfolio a{
  display:inline-block;
  margin:0 0 2rem;
  width:100%;
}
.portfolio img{
  width:100%;
  border-radius:4px;
  filter:grayscale(30%) contrast(120%);
  transition:.4s;
}
.portfolio img:hover{
  filter:none;
  transform:scale(1.03) rotate(-0.5deg);
}

/* CONTACT */
.contact{
  text-align:center;
  padding:6rem 2rem;
  background:#000;
}
.contact a{
  display:inline-block;
  margin-top:2rem;
  padding:1rem 2.5rem;
  border:2px solid #f72585;
  color:#f72585;
  text-decoration:none;
  font-weight:600;
}
.contact a:hover{
  background:#f72585;
  color:#000;
}

/* FOOTER */
footer{
  text-align:center;
  padding:2rem;
  opacity:.5;
  font-size:.8rem;
}

/* SIGNATURE */
.signature{
  position:fixed;
  bottom:1rem;
  left:1rem;
  font-family:'Permanent Marker',cursive;
  font-size:1.2rem;
  opacity:.4;
}

/* MOBILE */
@media(max-width:768px){
  header h1{font-size:3.2rem}
  .portfolio{columns:2 160px}
}
</style>
</head>
